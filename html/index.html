<!DOCTYPE html>

<head>
    <title>Web Page</title>

    <!-- one way of writing the css -->
    <link href="../css/first.css" rel="stylesheet">

    <!-- this way is limited to the same html page only , this is not reusable-->
    <style>
        #text {
            background-color: green;
        }
    </style>
</head>
<!-- Inline css is when css is defined in html elements -->

<body style="background-color: blue;">
    <div>
        <h3 id="text">Just a Page</h3>
    </div>
</body>

</html>
